name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, and unit tests
        run: |
          npm run lint
          npm run typecheck
          npm test -- --ci

      - name: Configure optional release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/poco-release.keystore"
            echo "POCO_RELEASE_STORE_FILE=$RUNNER_TEMP/poco-release.keystore" >> "$GITHUB_ENV"
            echo "POCO_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "POCO_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "POCO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK (and AAB if signed)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon
          if [ -n "${POCO_RELEASE_STORE_FILE:-}" ]; then
            ./gradlew bundleRelease --no-daemon
          fi

      - name: Prepare build artifacts
        run: |
          mkdir -p release-output
          SHORT_SHA="${GITHUB_SHA::7}"
          cp android/app/build/outputs/apk/release/app-release.apk "release-output/poco-naturals-${GITHUB_REF_NAME}-${SHORT_SHA}.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "release-output/poco-naturals-${GITHUB_REF_NAME}-${SHORT_SHA}.aab"
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poco-naturals-android-build
          path: |
            release-output/*.apk
            release-output/*.aab

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-output/*.apk
            release-output/*.aab
